<meta charset="utf-8">
<title>Bandeira do Brasil — LR Consultoria</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;background:#0f2a10}
  body{font-family:Inter,"Inter Display",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;background:#173a16}
  #sky,#flag{position:absolute;left:0;top:0;width:1080px;height:1350px}
  .msg{position:absolute;left:90px;right:90px;top:820px;text-align:center;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}

  .msg p{margin-top:26px;font-size:40px;font-weight:500;line-height:1.3;color:#e9f3e2}
  .msg p b{font-weight:800;color:#fff}
  .rule{position:absolute;left:50%;top:1132px;width:120px;height:6px;margin-left:-60px;border-radius:3px;
    background:linear-gradient(90deg,#009c3b,#ffdf00,#002776)}
  .brand{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);
    background:#fff;border-radius:22px;padding:14px 34px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .brand img{display:block;height:112px;width:auto}
</style>
</head>

  <div class="brand"><img src="logo.jpg" alt="LR Consultoria Agropecuária"></div>
</div>

<script>
(async function () {
  /* ---------- céu ---------- */
  const sky = document.getElementById('sky').getContext('2d');
  const g = sky.createLinearGradient(0, 0, 0, 1350);
  g.addColorStop(0, '#3f87c9'); g.addColorStop(.38, '#8cbde3'); g.addColorStop(.56, '#b9d6c4');
  g.addColorStop(.66, '#2e6b30'); g.addColorStop(.8, '#173a16'); g.addColorStop(1, '#0f2a10');
  sky.fillStyle = g; sky.fillRect(0, 0, 1080, 1350);
  // nuvens suaves (determinísticas)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  sky.filter = 'blur(28px)';
  for (let i = 0; i < 26; i++) {
    const cx = rnd() * 1200 - 60, cy = 120 + rnd() * 560, rx = 90 + rnd() * 190, ry = 26 + rnd() * 50;
    sky.fillStyle = `rgba(255,255,255,${.18 + rnd() * .32})`;
    sky.beginPath(); sky.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); sky.fill();
  }
  sky.filter = 'none';
  // sol difuso no alto, à esquerda
  const sun = sky.createRadialGradient(170, 90, 0, 170, 90, 520);
  sun.addColorStop(0, 'rgba(255,248,220,.75)'); sun.addColorStop(1, 'rgba(255,248,220,0)');
  sky.fillStyle = sun; sky.fillRect(0, 0, 1080, 800);

  /* ---------- textura da bandeira ---------- */
  const xml = document.getElementById('bandeira').innerHTML.trim();
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  await img.decode();
  const tex = document.createElement('canvas'); tex.width = 2400; tex.height = 1680;
  tex.getContext('2d').drawImage(img, 0, 0, 2400, 1680);

  /* ---------- tecido em WebGL ---------- */
  const cv = document.getElementById('flag');
  const gl = cv.getContext('webgl', { antialias: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
  const S = 2; // canvas em 2x
  const VS = `
    attribute vec2 a_uv;
    uniform vec2 u_res;
    varying vec2 v_uv; varying float v_z;
    
    float height(vec2 uv){
      // altura do tecido (px) — presa no mastro (u=0), dobras diagonais que crescem para a ponta
      float env = pow(uv.x, 0.85);
      float z = 0.0;
      z += 46.0 * sin(uv.x * 8.2 - uv.y * 1.9 + 0.4);
      z += 22.0 * sin(uv.x * 14.5 + uv.y * 3.2 + 1.7);
      z += 8.0 * sin(uv.x * 29.0 - uv.y * 6.0 + 0.3);
      z += 3.0 * sin(uv.x * 47.0 + uv.y * 11.0);
      return z * env;
    }
    void main(){
      vec2 uv = a_uv; float z = height(uv);
      // posição em px (1080×1350): mastro em x=128, topo em y=150, bandeira 840×588
      float x = 128.0 + uv.x * 840.0 * 0.965 + z * 0.22;
      float y = 150.0 + uv.y * 588.0 + z * 0.55 + 26.0 * uv.x * uv.x - 10.0 * uv.x * (1.0 - uv.y);
      v_uv = uv; v_z = z;
      vec2 p = vec2(x, y) * 2.0;
      gl_Position = vec4(p / u_res * 2.0 - 1.0, 0.0, 1.0) * vec4(1.0, -1.0, 1.0, 1.0);
    }`;
  const FS = `
    precision highp float;
    uniform sampler2D u_tex;
    varying vec2 v_uv; varying float v_z;
    
    float height(vec2 uv){
      // altura do tecido (px) — presa no mastro (u=0), dobras diagonais que crescem para a ponta
      float env = pow(uv.x, 0.85);
      float z = 0.0;
      z += 46.0 * sin(uv.x * 8.2 - uv.y * 1.9 + 0.4);
      z += 22.0 * sin(uv.x * 14.5 + uv.y * 3.2 + 1.7);
      z += 8.0 * sin(uv.x * 29.0 - uv.y * 6.0 + 0.3);
      z += 3.0 * sin(uv.x * 47.0 + uv.y * 11.0);
      return z * env;
    }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec2 uv = v_uv;
      float e = 0.0015;
      float dzdu = (height(uv + vec2(e, 0.0)) - height(uv - vec2(e, 0.0))) / (2.0 * e) / 840.0;
      float dzdv = (height(uv + vec2(0.0, e)) - height(uv - vec2(0.0, e))) / (2.0 * e) / 588.0;
      vec3 n = normalize(vec3(-dzdu, -dzdv, 1.0));
      vec3 L = normalize(vec3(-0.62, -0.5, 0.55));
      vec3 V = vec3(0.0, 0.0, 1.0);
      vec3 H = normalize(L + V);
      float diff = max(dot(n, L), 0.0);
      float spec = pow(max(dot(n, H), 0.0), 38.0);
      // oclusão nos vales das dobras
      float ao = clamp(0.78 + v_z / 120.0, 0.55, 1.08);
      // trama do tecido
      vec2 t = uv * vec2(840.0, 588.0) * 1.15;
      float weave = 0.5 + 0.5 * sin(t.x * 3.14159) * sin(t.y * 3.14159);
      float grain = hash(floor(t * 1.5)) * 0.5 + 0.5;
      vec3 base = texture2D(u_tex, uv).rgb;
      vec3 col = base * (0.16 + 1.12 * diff) * ao;
      col *= 0.94 + 0.06 * weave * grain;
      col += vec3(1.0, 0.98, 0.92) * spec * 0.16;
      // bordas costuradas levemente mais escuras
      float hem = smoothstep(0.0, 0.012, uv.y) * smoothstep(0.0, 0.012, 1.0 - uv.y) * smoothstep(0.0, 0.008, 1.0 - uv.x);
      col *= 0.82 + 0.18 * hem;
      gl_FragColor = vec4(col, 1.0);
    }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr); gl.useProgram(pr);

  const NX = 240, NY = 168, verts = [];
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const u0 = i / NX, u1 = (i + 1) / NX, v0 = j / NY, v1 = (j + 1) / NY;
    verts.push(u0, v0, u1, v0, u0, v1, u1, v0, u1, v1, u0, v1);
  }
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a_uv'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform2f(gl.getUniformLocation(pr, 'u_res'), cv.width, cv.height);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, verts.length / 2);

  /* ---------- mastro com ponteira ---------- */
  const c2 = document.createElement('canvas'); c2.width = 2160; c2.height = 2700;
  const p = c2.getContext('2d'); p.scale(2, 2);
  const pole = p.createLinearGradient(112, 0, 130, 0);
  pole.addColorStop(0, '#6e6a62'); pole.addColorStop(.35, '#f4f1ea'); pole.addColorStop(.6, '#c9c3b6'); pole.addColorStop(1, '#4e4a43');
  const fade = p.createLinearGradient(0, 0, 0, 1350);
  p.fillStyle = pole; p.fillRect(113, 118, 16, 760);
  p.globalCompositeOperation = 'destination-out';
  fade.addColorStop(0, 'rgba(0,0,0,0)'); fade.addColorStop(.5, 'rgba(0,0,0,0)'); fade.addColorStop(.6, 'rgba(0,0,0,1)');
  p.fillStyle = fade; p.fillRect(100, 0, 40, 1350);
  p.globalCompositeOperation = 'source-over';
  const ball = p.createRadialGradient(116, 98, 2, 121, 104, 22);
  ball.addColorStop(0, '#fff6c8'); ball.addColorStop(.35, '#e2b93b'); ball.addColorStop(1, '#7a5a10');
  p.fillStyle = ball; p.beginPath(); p.arc(121, 104, 19, 0, Math.PI * 2); p.fill();
  // cordas/argolas
  p.fillStyle = '#3d3a35'; p.fillRect(127, 150, 6, 10); p.fillRect(127, 728, 6, 10);

  // compõe mastro + tecido e substitui o canvas WebGL pela imagem final
  const fc = document.getElementById('flag');
  const final = document.createElement('canvas'); final.width = 2160; final.height = 2700;
  final.id = 'flag'; final.style.cssText = 'position:absolute;left:0;top:0;width:1080px;height:1350px';
  const fx = final.getContext('2d');
  fx.drawImage(c2, 0, 0); fx.drawImage(cv, 0, 0);
  fc.replaceWith(final);
  document.body.dataset.ready = '1';
})();
</script>
